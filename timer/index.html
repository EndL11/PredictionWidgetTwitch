<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src wss://irc-ws.chat.twitch.tv; base-uri 'none'; form-action 'none'">
<title>StreamerTools — таймер марафону</title>
<style>
  /* шрифт у стилі GTA: лише встановлений на ПК (безкоштовна ліцензія Typodermic не дозволяє роздавати його як webfont) */
  @font-face { font-family: "GTA"; font-display: block;
    src: local("Pricedown"), local("Pricedown Bl"), local("Pricedown Black"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "GTA", "Impact", "Haettenschweiler", "Arial Narrow", "Arial Black", sans-serif; color: #fff;
  }
  /* #pos ставить центр блоку в точку (x%, y%) джерела; #w — блок розміром із вміст, fit() масштабує його zoom-ом.
     Окремі множники розміру — zoom на #label і #clock */
  #pos { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
  #pos.on { display: block; }
  #w { text-align: center; white-space: nowrap; padding: 0 .5em; font-size: 60px; } /* запас під курсив і світіння, які виходять за межі гліфів */
  #label { position: relative; font-size: 46px; text-transform: uppercase; letter-spacing: .04em; line-height: 1.15; }
  /* прев'ю в налаштуваннях: блок і напис можна тягати мишкою */
  body.preview #w { cursor: move; outline: 3px dashed rgba(255,255,255,.4); outline-offset: 4px; touch-action: none; }
  body.preview #label { cursor: grab; outline: 2px dashed rgba(255,209,102,.7); }
  #clock { font-size: 112px; line-height: 1; font-variant-numeric: tabular-nums; transition: opacity .3s; }
  #clock.paused { animation: blink 1.2s steps(2, start) infinite; } /* на паузі цифри блимають, як у грі */
  @keyframes blink { to { opacity: .35; } }

  /* vice: неоновий захід сонця (як тема vice у віджеті прогнозів) */
  body.vice #label {
    font-style: italic; padding: 0 .25em; /* background-clip:text малює лише в межах блоку, а курсив виходить за нього */
    background: linear-gradient(90deg, #ffd166, #ff8a3d 35%, #ff2e88 70%, #b14dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #2a0638) drop-shadow(0 0 12px rgba(255,46,136,.55));
  }
  body.vice #clock { font-style: italic; color: #3ff5e6; text-shadow: 0 0 16px rgba(25,227,212,.7), 0 4px 0 #06121f; }
  body.vice #clock.stopped { color: #ffd166; text-shadow: 0 0 16px rgba(255,209,102,.7), 0 4px 0 #2a0638; }

  /* hud: класичний ігровий HUD */
  body.hud { font-family: "GTA", "Arial Black", "Impact", sans-serif; }
  body.hud #label, body.hud #clock {
    text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 4px 0 #000, 4px 4px 0 #000;
  }
  body.hud #label { font-size: 40px; }
  body.hud #clock { font-size: 96px; color: #7fd14a; }
  body.hud #clock.stopped { color: #ffd23f; }

  /* sa: як годинник у старих GTA — білий текст у товстому чорному контурі, без кольорів і світіння */
  body.sa { font-family: "GTA", "Arial Black", "Impact", sans-serif; }
  body.sa #label, body.sa #clock {
    color: #fff;
    text-shadow: -3px -3px 0 #000, 0 -3px 0 #000, 3px -3px 0 #000, -3px 0 0 #000, 3px 0 0 #000,
                 -3px 3px 0 #000, 0 3px 0 #000, 3px 3px 0 #000, 4px 5px 0 #000;
  }
  body.sa #label { font-size: 42px; letter-spacing: .02em; }
  body.sa #clock { font-size: 104px; color: #f2f2f2; }
  body.sa #clock.stopped { color: #ffd23f; }

  #hint { display: none; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #efeff1; background: #0e0e10;
          padding: 24px; border-radius: 10px; max-width: 520px; line-height: 1.5; }
  #hint.on { display: block; }
  #hint a { color: #bf94ff; }
  html.cfg, html.cfg body { background: #0e0e10; }
</style>
</head>
<body>
<div id="pos"><div id="w"><div id="label"></div><div id="clock">00:00:00</div></div></div>
<div id="hint">Це віджет таймера StreamerTools для OBS. Налаштуйте його і згенеруйте посилання на сторінці <a href="../setup/#timer">налаштувань</a> (вкладка «Таймер марафону»).</div>

<script>
/* ================== CONFIG ==================
   Режими (один з трьох):
     timer/#channel=<логін>     – керування з чату: !timer start | pause | unpause | stop | reset (або !таймер старт | пауза | продовжити | стоп | скинути).
                                  Команди приймаються лише від стрімера (не від модераторів). Стан зберігається
                                  в localStorage OBS і переживає перезапуск ПК/OBS/стріму.
     timer/#start=<unix ms>     – рахує вгору від цього моменту
     timer/#end=<unix ms>       – рахує вниз до цього моменту
   Вигляд:
     title=МАРАФОН GTA VI       – напис зверху
     title_size=100             – розмір напису, % (50–300)
     clock_size=100             – розмір цифр, % (50–300)
     theme=vice|hud|sa          – стиль (за замовч. vice)
     days=full|short|hours|custom – як писати дні: «3 дні», «3Д», без днів (77:42:19), або свій текст
     days_text=день,дні,днів    – для days=custom: одна форма для всіх чисел або три (1 / 2–4 / 5+)
   Розташування:
     x=50, y=50                 – де центр блоку, % ширини/висоти джерела
     size=97                    – ширина блоку, % ширини джерела (10–100; обмежується й висотою)
     align=center|left|right    – вирівнювання напису й цифр одне відносно одного
     gap=0                      – відступ між написом і цифрами, px (−100…300)
     title_x=0, title_y=0       – зсув напису відносно свого місця, px (−600…600)
     preview=1                  – режим прев'ю для сторінки налаштувань (перетягування мишкою)
============================================== */
const P = new URLSearchParams(location.hash.length > 1 ? location.hash.slice(1) : location.search);
const START = Number(P.get("start")) || 0, END = Number(P.get("end")) || 0;
const CHANNEL = (P.get("channel") || "").toLowerCase().replace(/[^a-z0-9_]/g, ""); // логін Twitch: лише a-z0-9_
const PREVIEW = P.get("preview") === "1";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (Q, k, def, a, b) => { const v = parseFloat(Q.get(k)); return clamp(Number.isFinite(v) ? v : def, a, b); };

// вигляд і розташування; у прев'ю переписується повідомленнями від сторінки налаштувань
function parse(Q) {
  return {
    title: Q.get("title") || "МАРАФОН GTA VI",
    theme: ["vice", "hud", "sa"].includes(Q.get("theme")) ? Q.get("theme") : "vice",
    titleSize: num(Q, "title_size", 100, 50, 300) / 100,
    clockSize: num(Q, "clock_size", 100, 50, 300) / 100,
    days: ["full", "short", "hours", "custom"].includes(Q.get("days")) ? Q.get("days") : "full",
    // свій текст: до трьох форм через кому, кожна до 20 символів; виводиться через textContent
    custom: (Q.get("days_text") || "").split(",").map(w => w.trim().slice(0, 20)).filter(Boolean).slice(0, 3),
    x: num(Q, "x", 50, 0, 100), y: num(Q, "y", 50, 0, 100),
    size: num(Q, "size", 97, 10, 100),
    align: ["left", "right"].includes(Q.get("align")) ? Q.get("align") : "center",
    gap: num(Q, "gap", 0, -100, 300),
    titleX: num(Q, "title_x", 0, -600, 600), titleY: num(Q, "title_y", 0, -600, 600),
  };
}
let C = parse(P);

const pad = n => String(n).padStart(2, "0");
// 1 день, 2–4 дні, 5–20 днів, 21 день…
function daysWord(d, forms = ["день", "дні", "днів"]) {
  const t = d % 10, h = d % 100;
  const i = t === 1 && h !== 11 ? 0 : t >= 2 && t <= 4 && (h < 12 || h > 14) ? 1 : 2;
  return forms[Math.min(i, forms.length - 1)]; // одна форма — для всіх чисел
}
// секунди -> ГГ:ХХ:СС, а від 24 годин -> «N дні ГГ:ХХ:СС»
function fmt(sec) {
  sec = Math.max(0, sec);
  const ms = ":" + pad(Math.floor(sec % 3600 / 60)) + ":" + pad(sec % 60);
  if (C.days === "hours") return pad(Math.floor(sec / 3600)) + ms; // години не обрізаються на 24
  const d = Math.floor(sec / 86400), hms = pad(Math.floor(sec % 86400 / 3600)) + ms;
  if (!d) return hms;
  if (C.days === "short") return d + "Д " + hms;
  if (C.days === "custom" && C.custom.length) return d + " " + daysWord(d, C.custom) + " " + hms;
  return d + " " + daysWord(d) + " " + hms;
}

/* ---------- стан таймера з чату ----------
   {status: idle|running|paused|stopped, base: накопичені мс до поточного запуску, since: коли запущено}
   Читаємо з localStorage щотику, тож кілька джерел з цим таймером у різних сценах показують одне й те саме. */
const KEY = "st_timer_" + CHANNEL;
const IDLE = { status: "idle", base: 0, since: 0 };
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.status) return s; } catch {}
  return { ...IDLE };
}
const save = s => localStorage.setItem(KEY, JSON.stringify(s));
const elapsed = (s, now) => s.base + (s.status === "running" ? now - s.since : 0);

// публічна: викликається з чату і з тестів. cmd: start|pause|unpause|stop|reset
function command(cmd, now = Date.now()) {
  const s = load();
  if (cmd === "start") {
    if (s.status === "running") return s;
    // з паузи — продовжуємо; після стопу або з нуля — новий відлік
    save(s.status === "paused" ? { status: "running", base: s.base, since: now } : { status: "running", base: 0, since: now });
  } else if (cmd === "unpause") {
    // лише продовжує паузу; після стопу чи скидання нічого не робить, щоб випадково не почати новий відлік
    if (s.status !== "paused") return s;
    save({ status: "running", base: s.base, since: now });
  } else if (cmd === "pause") {
    if (s.status !== "running") return s;
    save({ status: "paused", base: elapsed(s, now), since: 0 });
  } else if (cmd === "stop") {
    if (s.status !== "running" && s.status !== "paused") return s;
    save({ status: "stopped", base: elapsed(s, now), since: 0 });
  } else if (cmd === "reset") {
    save({ ...IDLE }); // 00:00:00 і чекаємо на старт
  }
  return load();
}

const CMDS = { start: "start", "старт": "start", pause: "pause", "пауза": "pause", unpause: "unpause", resume: "unpause", "продовжити": "unpause", stop: "stop", "стоп": "stop", reset: "reset", "скинути": "reset" };
// tags — IRC-теги Twitch (їх ставить сервер, підробити не можна)
function onChat(tags, text) {
  const m = text.trim().toLowerCase().match(/^!(?:timer|таймер)\s+(\S+)/);
  if (!m || !CMDS[m[1]]) return;
  // лише стрімер: модератори й глядачі таймер не чіпають
  if (/(^|,)broadcaster\//.test(tags.badges || "")) { command(CMDS[m[1]]); tick(false); }
}

/* ---------- чат Twitch: анонімне читання через IRC WebSocket (токен не потрібен) ---------- */
function connectChat() {
  const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
  ws.onopen = () => {
    ws.send("CAP REQ :twitch.tv/tags");
    ws.send("PASS SCHMOOPIIE");
    ws.send("NICK justinfan" + (10000 + Math.floor(Math.random() * 80000)));
    ws.send("JOIN #" + CHANNEL);
  };
  ws.onmessage = e => {
    for (const line of e.data.split("\r\n")) {
      if (line.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); continue; }
      // @tags :user!user@user.tmi.twitch.tv PRIVMSG #channel :text
      const m = line.match(/^@(\S+) :\S+ PRIVMSG #\S+ :(.*)$/);
      if (!m) continue;
      const tags = Object.fromEntries(m[1].split(";").map(kv => kv.split("=")));
      onChat(tags, m[2]);
    }
  };
  ws.onclose = () => setTimeout(connectChat, 3000);
}

/* ---------- розкладка ---------- */
// вписуємо вміст: size% ширини джерела, але ніколи не більше за саме джерело (98% ширини, 95% висоти),
// і тримаємо блок повністю в кадрі, навіть якщо x/y біля краю. limited = довелось зменшити або зсунути.
let limited = false;
function fit() {
  const w = $("w");
  w.style.zoom = 1;
  const ow = w.offsetWidth, oh = w.offsetHeight;
  const want = innerWidth * C.size / 100 / ow;
  let z = Math.min(want, innerWidth * .98 / ow, innerHeight * .95 / oh);
  w.style.zoom = z;
  // ширина тексту під zoom не зовсім лінійна (округлення гліфів), тож міряємо фактичну рамку й за потреби дотискаємо
  let r = w.getBoundingClientRect();
  const k = Math.min(1, innerWidth * .98 / r.width, innerHeight * .95 / r.height);
  if (k < 1) { z *= k; w.style.zoom = z; r = w.getBoundingClientRect(); }
  const hw = r.width / 2 / innerWidth * 100, hh = r.height / 2 / innerHeight * 100; // половина блоку в % джерела
  const x = clamp(C.x, hw, 100 - hw), y = clamp(C.y, hh, 100 - hh);
  $("pos").style.left = x + "%"; $("pos").style.top = y + "%";
  limited = z < want - 1e-6 || Math.abs(x - C.x) > .05 || Math.abs(y - C.y) > .05;
  if (PREVIEW) parent.postMessage({ type: "st-timer-fit", limited }, "*");
}
function layout() {
  document.body.classList.remove("vice", "hud", "sa");
  document.body.classList.add(C.theme);
  $("label").textContent = C.title;
  $("label").style.zoom = C.titleSize;
  $("label").style.left = C.titleX + "px"; $("label").style.top = C.titleY + "px";
  $("clock").style.zoom = C.clockSize;
  $("clock").style.marginTop = C.gap + "px";
  $("w").style.textAlign = C.align;
  lastLen = 0; tick(false); // перемалювати цифри (формат днів міг змінитись) і перевписати розмір
}
let lastLen = 0;

let tickTimer = null;
function tick(loop = true) {
  const now = Date.now();
  let sec, st = "running";
  if (CHANNEL) { const s = load(); st = s.status; sec = Math.floor(elapsed(s, now) / 1000); }
  else sec = END ? Math.ceil((END - now) / 1000) : Math.floor((now - START) / 1000);
  const c = $("clock");
  c.textContent = fmt(sec);
  if (c.textContent.length !== lastLen) { lastLen = c.textContent.length; fit(); } // змінився формат (напр. з'явились дні)
  c.classList.toggle("paused", st === "paused");
  c.classList.toggle("stopped", st === "stopped");
  if (loop) { clearTimeout(tickTimer); tickTimer = setTimeout(tick, 1000 - now % 1000 + 5); } // на межу секунди
}

/* ---------- прев'ю: перетягування мишкою, зв'язок зі сторінкою налаштувань ----------
   Приймаємо лише повідомлення від батьківського вікна (e.source), шлемо назад лише числа розташування. */
function startPreview() {
  document.body.classList.add("preview");
  let drag = null;
  const w = $("w");
  w.addEventListener("pointerdown", e => {
    e.preventDefault();
    const onTitle = $("label").contains(e.target);
    const z = (parseFloat(w.style.zoom) || 1) * (onTitle ? C.titleSize : 1); // перерахунок екранних px у px розкладки
    drag = { onTitle, z, sx: e.clientX, sy: e.clientY, c: { ...C } };
    w.setPointerCapture(e.pointerId);
  });
  w.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (drag.onTitle) {
      C.titleX = Math.round(clamp(drag.c.titleX + dx / drag.z, -600, 600));
      C.titleY = Math.round(clamp(drag.c.titleY + dy / drag.z, -600, 600));
    } else {
      C.x = Math.round(clamp(drag.c.x + dx / innerWidth * 100, 0, 100) * 10) / 10;
      C.y = Math.round(clamp(drag.c.y + dy / innerHeight * 100, 0, 100) * 10) / 10;
    }
    layout();
    parent.postMessage({ type: "st-timer-layout", x: C.x, y: C.y, title_x: C.titleX, title_y: C.titleY }, "*");
  });
  const end = () => { drag = null; };
  w.addEventListener("pointerup", end); w.addEventListener("pointercancel", end);
  addEventListener("message", e => {
    if (e.source !== parent || e.data?.type !== "st-timer-params" || typeof e.data.hash !== "string") return;
    C = parse(new URLSearchParams(e.data.hash));
    layout();
  });
}

if (CHANNEL || START || END) {
  $("pos").className = "on";
  addEventListener("resize", fit);
  layout();
  tick();
  document.fonts.ready.then(fit); // шрифт GTA може підвантажитись після першого виміру
  if (CHANNEL && !PREVIEW) connectChat();
  if (PREVIEW) startPreview();
} else {
  document.documentElement.className = "cfg";
  $("hint").className = "on";
}
</script>
</body>
</html>
